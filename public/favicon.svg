  <path d="M 225 155 Q 240 167 250 155" fill="none" stroke="#BF360C" stroke-width="6" stroke-linecap="round"/>
  <path d="M 262 155 Q 272 167 287 155" fill="none" stroke="#BF360C" stroke-width="6" stroke-linecap="round"/>
